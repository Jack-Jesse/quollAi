<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Lucky Draw</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #FF6B6B, #4ECDC4);
            color: white;
            text-align: center;
            padding: 30px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #4ECDC4;
            padding-bottom: 10px;
        }

        .add-kid {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .add-kid input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .add-kid input:focus {
            outline: none;
            border-color: #4ECDC4;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #4ECDC4;
            color: white;
        }

        .btn-primary:hover {
            background: #45b7aa;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #66BB6A;
            color: white;
        }

        .btn-success:hover {
            background: #5cb85c;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #FF6B6B;
            color: white;
        }

        .btn-danger:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #FFA726;
            color: white;
        }

        .btn-warning:hover {
            background: #ff9800;
            transform: translateY(-2px);
        }

        .kids-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .kid-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .kid-info {
            flex: 1;
        }

        .kid-name {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
        }

        .kid-points {
            color: #666;
            font-size: 0.9em;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 14px;
        }

        .spin-section {
            text-align: center;
            margin: 30px 0;
        }

        .spin-btn {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 24px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
        }

        .spin-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 107, 107, 0.4);
        }

        .spin-btn:active {
            transform: translateY(-1px);
        }

        .winner-display {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 15px;
            margin: 20px 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .winner-text {
            font-size: 2em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .no-kids {
            text-align: center;
            color: #666;
            padding: 40px;
            font-style: italic;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        .bounce {
            animation: bounce 1s ease-in-out;
        }

        .spin-animation {
            animation: spin 2s ease-in-out;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .controls {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Kids Lucky Draw</h1>
            <p>Good Behavior = More Chances to Win!</p>
        </div>

        <div class="main-content">
            <div class="left-panel">
                <div class="section">
                    <h2>Add New Kid</h2>
                    <div class="add-kid">
                        <input type="text" id="kidName" placeholder="Enter kid's name" maxlength="50">
                        <button class="btn btn-primary" onclick="addKid()">Add Kid</button>
                    </div>
                </div>

                <div class="section">
                    <h2>Kids List & Points</h2>
                    <div id="kidsList" class="kids-list">
                        <div class="no-kids">No kids added yet. Add some kids to get started!</div>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="section">
                    <h2>Lucky Draw</h2>
                    <div class="spin-section">
                        <button class="spin-btn" onclick="runDraw()" id="spinBtn">
                            🎲 SPIN FOR WINNER!
                        </button>
                    </div>
                    <div id="winnerDisplay" class="winner-display">
                        <div class="winner-text">No winner yet</div>
                    </div>
                </div>

                <div class="section">
                    <h2>Controls</h2>
                    <div class="controls">
                        <button class="btn btn-warning" onclick="resetPoints()">Reset Points</button>
                        <button class="btn btn-danger" onclick="clearAll()">Clear All</button>
                        <button class="btn btn-success" onclick="exportHistory()">Export History</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data storage
        let kids = JSON.parse(localStorage.getItem('kids')) || [];
        let history = JSON.parse(localStorage.getItem('history')) || [];

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            refreshKidsDisplay();
            document.getElementById('kidName').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addKid();
                }
            });
        });

        function addKid() {
            const nameInput = document.getElementById('kidName');
            const name = nameInput.value.trim();
            
            if (!name) {
                alert('Please enter a name!');
                return;
            }

            // Check if kid already exists
            if (kids.some(kid => kid.name.toLowerCase() === name.toLowerCase())) {
                alert(`${name} is already in the list!`);
                return;
            }

            kids.push({ name: name, points: 0 });
            saveData();
            refreshKidsDisplay();
            nameInput.value = '';
            
            // Show feedback
            showNotification(`${name} added successfully!`, 'success');
        }

        function addPoint(kidName) {
            const kid = kids.find(k => k.name === kidName);
            if (kid) {
                kid.points++;
                saveData();
                refreshKidsDisplay();
                
                // Show feedback
                showNotification(`✅ +1 point for ${kidName}!`, 'success');
            }
        }

        function runDraw() {
            if (kids.length === 0) {
                alert('Please add kids first!');
                return;
            }

            const totalEntries = kids.reduce((sum, kid) => sum + kid.points, 0);
            
            if (totalEntries === 0) {
                alert('No points awarded yet! Award some points first.');
                return;
            }

            // Add spinning animation
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.classList.add('spin-animation');
            
            // Disable button during animation
            spinBtn.disabled = true;

            setTimeout(() => {
                // Create weighted list for random selection
                const entries = [];
                kids.forEach(kid => {
                    for (let i = 0; i < kid.points; i++) {
                        entries.push(kid.name);
                    }
                });

                // Random selection
                const winner = entries[Math.floor(Math.random() * entries.length)];
                
                // Update winner display
                const winnerDisplay = document.getElementById('winnerDisplay');
                winnerDisplay.innerHTML = `<div class="winner-text bounce">🎉 WINNER: ${winner}! 🎉</div>`;
                
                // Add to history
                const today = new Date().toISOString().split('T')[0];
                history.push({
                    date: today,
                    winner: winner,
                    total_entries: totalEntries
                });
                
                saveData();
                
                // Remove animation and re-enable button
                spinBtn.classList.remove('spin-animation');
                spinBtn.disabled = false;
                
                // Ask if they want to reset points
                setTimeout(() => {
                    if (confirm(`Congratulations ${winner}!\n\nReset points for next day?`)) {
                        resetPoints();
                    }
                }, 1000);
                
            }, 2000);
        }

        function resetPoints() {
            if (confirm('Reset all points to zero?')) {
                kids.forEach(kid => kid.points = 0);
                saveData();
                refreshKidsDisplay();
                
                const winnerDisplay = document.getElementById('winnerDisplay');
                winnerDisplay.innerHTML = '<div class="winner-text">Points reset! Ready for new day.</div>';
                
                setTimeout(() => {
                    winnerDisplay.innerHTML = '<div class="winner-text">No winner yet</div>';
                }, 3000);
            }
        }

        function clearAll() {
            if (confirm('Remove all kids and clear history?\nThis cannot be undone!')) {
                kids = [];
                history = [];
                saveData();
                refreshKidsDisplay();
                
                const winnerDisplay = document.getElementById('winnerDisplay');
                winnerDisplay.innerHTML = '<div class="winner-text">All data cleared.</div>';
                
                setTimeout(() => {
                    winnerDisplay.innerHTML = '<div class="winner-text">No winner yet</div>';
                }, 2000);
            }
        }

        function exportHistory() {
            if (history.length === 0) {
                alert('No draw history to export!');
                return;
            }

            const filename = `draw_history_${new Date().toISOString().split('T')[0]}.txt`;
            let content = '🎯 Kids Lucky Draw History\n';
            content += '='.repeat(40) + '\n\n';

            history.forEach(record => {
                content += `Date: ${record.date}\n`;
                content += `Winner: ${record.winner}\n`;
                content += `Total Entries: ${record.total_entries}\n`;
                content += '-'.repeat(30) + '\n';
            });

            // Create and download file
            const blob = new Blob([content], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            window.URL.revokeObjectURL(url);
            
            showNotification(`History exported to ${filename}`, 'success');
        }

        function refreshKidsDisplay() {
            const kidsList = document.getElementById('kidsList');
            
            if (kids.length === 0) {
                kidsList.innerHTML = '<div class="no-kids">No kids added yet. Add some kids to get started!</div>';
                return;
            }

            kidsList.innerHTML = kids.map(kid => `
                <div class="kid-item">
                    <div class="kid-info">
                        <div class="kid-name">${kid.name}</div>
                        <div class="kid-points">${kid.points} points</div>
                    </div>
                    <button class="btn btn-success btn-small" onclick="addPoint('${kid.name}')">
                        +1 ${kid.name}
                    </button>
                </div>
            `).join('');
        }

        function saveData() {
            localStorage.setItem('kids', JSON.stringify(kids));
            localStorage.setItem('history', JSON.stringify(history));
        }

        function showNotification(message, type) {
            // Create notification element
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 20px;
                border-radius: 10px;
                color: white;
                font-weight: bold;
                z-index: 1000;
                animation: slideIn 0.3s ease-out;
                max-width: 300px;
            `;
            
            if (type === 'success') {
                notification.style.background = '#66BB6A';
            } else if (type === 'error') {
                notification.style.background = '#FF6B6B';
            } else {
                notification.style.background = '#4ECDC4';
            }
            
            notification.textContent = message;
            document.body.appendChild(notification);
            
            // Remove after 3 seconds
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Add CSS animation for notifications
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
